name: Story Workflow Validation

on:
  push:
    branches:
      - main
      - 'work/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test workflow validator
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Re-run executable chapter experiments
        run: python tools/run_chapter_experiments.py
      - name: Re-run research experiments
        run: |
          python experiments/EXP-006-majority-mixture-local-accessibility/run.py --check
          python experiments/EXP-007-minority-escape-counterexample-search/run.py --check
      - name: Validate repository workflow
        shell: bash
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            python tools/validate_workflow.py --strict
          else
            python tools/validate_workflow.py --strict --allow-drafts
          fi
