name: Story Workflow Validation

on:
  push:
    branches:
      - main
      - 'work/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test workflow validator
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Re-run executable chapter experiments
        run: python tools/run_chapter_experiments.py

      - name: Validate repository workflow
        run: python tools/validate_workflow.py --strict
